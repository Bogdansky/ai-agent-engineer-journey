[project]
name = "ai-agent-engineer-journey"
version = "0.1.0"
description = "Incident-triage agent: sandbox service, failure scenarios, MCP server, own agent loop, evals, tracing."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.4,<3",
    "fastapi>=0.115",
    "httpx>=0.27",
    "mcp>=2.3,<3",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["incident_lab", "incident_lab.scenarios"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
